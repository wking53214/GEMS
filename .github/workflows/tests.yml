name: Tests

on:
  push:
    branches: [ main, claude/remove-triad-42-gems-168h1o ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        # The transport tests need the kernel, TIE and CNS. Pinned to full commit SHAs
        # (kernel main, TIE main, CNS v1.8.0); bump them deliberately. All three repos are public.
        pip install \
          "conservation-kernel @ git+https://github.com/wking53214/Conservation_Kernel.git@570c2c7908d9981dc1988c1028dd394db878d790" \
          "tie-transcript-intelligence-engine @ git+https://github.com/wking53214/TIE.git@895ce7ec2bc10b747dbc0519c7def37a0f447150" \
          "cns @ git+https://github.com/wking53214/CNS.git@5252ceebe98185f7be81212d988055ccf9884568"

    - name: Run tests
      # GEMS_REQUIRE_TRANSPORT=1 (see conftest.py) turns any skipped test into a failure, so the
      # transport and TIE lineage tests cannot silently skip here.
      env:
        GEMS_REQUIRE_TRANSPORT: "1"
      run: |
        pytest tests/ -v -rs
