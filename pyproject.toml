[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems-infrastructure"
version = "0.1.0"
description = "Evidence-preserving multi-Gem orchestration baseline reconstructed from the GEMS-FER-1.0 forensic package"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "William King" }]
dependencies = [
    "conservation-kernel",  # Required for transport layer and forensic verification
]

[project.optional-dependencies]
dev = ["pytest>=8"]
transport = [
    "conservation-kernel",  # For transport.gems_transport and forensic integrity verification
]
# Optional: lets GEMS's verdicts be expressed as CNS gate results. GEMS imports
# nothing from CNS unless gems.cns_connector or gems_transport.cns_connector is
# used. Pinned to tag v1.4.0.
cns = [
    "cns @ git+https://github.com/wking53214/cns.git@3b465dbcc1a6a4ab6f1040f93d44483196abd737",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
